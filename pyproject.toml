[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kilix-pdf-conversion"
version = "0.3.1"
description = "Validated multi-engine PDF-to-Markdown conversion workflow"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "itsmygithubacct" }]
keywords = ["document-ai", "docling", "markdown", "ocr", "pdf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup",
]
dependencies = [
  "pymupdf>=1.27.1,<1.28",
  "pymupdf4llm==0.3.4",
]

[project.optional-dependencies]
granite = [
  "docling[vlm]==2.118.0",
  "docling-core==2.90.0",
  "transformers==4.57.3",
  "pypdfium2==5.12.1",
]
marker = ["marker-pdf>=1.10,<2"]
test = ["pytest>=8.3"]
dev = ["build>=1.2", "pytest>=8.3", "ruff>=0.15"]

[project.scripts]
kilix-pdf = "kilix_pdf_conversion.cli:main"

[project.urls]
Homepage = "https://github.com/itsmygithubacct/kilix-pdf-conversion"
Repository = "https://github.com/itsmygithubacct/kilix-pdf-conversion.git"
Issues = "https://github.com/itsmygithubacct/kilix-pdf-conversion/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kilix_pdf_conversion = ["data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.uv]
conflicts = [
  [
    { extra = "granite" },
    { extra = "marker" },
  ],
]
