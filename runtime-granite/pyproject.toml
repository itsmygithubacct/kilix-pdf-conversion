[project]
name = "kilix-pdf-granite-runtime"
version = "0.3.1"
requires-python = "==3.12.*"
dependencies = [
  "pymupdf==1.27.2.3",
  "pymupdf4llm==0.3.4",
  "docling[vlm]==2.118.0",
  "docling-core==2.90.0",
  "pypdfium2==5.12.1",
  "torch==2.6.0+cpu",
  "torchvision==0.21.0+cpu",
  "transformers==4.57.3",
  "accelerate==1.12.0",
  "peft==0.18.1",
  "safetensors==0.8.0",
  "pillow==12.3.0",
]

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.15.20", "build==1.5.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
